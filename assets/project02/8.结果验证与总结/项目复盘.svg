<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><g font-family="Arial, sans-serif"><path d="M71 18H1368M71 1056H1368" stroke="#888" stroke-width="2"/><text x="720" y="109.0" font-size="21" font-weight="700" fill="#111" text-anchor="middle">PROJECT REVIEW</text><text x="720" y="135.25" font-size="21" font-weight="700" fill="#111" text-anchor="middle">项目复盘</text><text x="306" y="190.0" font-size="16" font-weight="400" fill="#111" text-anchor="start">以 ACRONYM 为品牌样本，用 AIGC 打通「品牌分析 → 视觉系统 → 商品详情 → 多平台落地」的电商视觉全流程。</text><text x="306" y="210.0" font-size="16" font-weight="400" fill="#111" text-anchor="start">本次项目验证了 AIGC 在服装电商视觉中的完整可行性：一套母版资产，即可高效复制到独立站与各电商平台。</text><rect x="110" y="254" width="300" height="288" fill="white" stroke="black"/><text x="260" y="361.0" font-size="22" font-weight="700" fill="black" text-anchor="middle">01·卖点锚定</text><text x="168" y="406.0" font-size="14" font-weight="400" fill="black" text-anchor="start">从品牌本身出发，锁定「机</text><text x="168" y="423.5" font-size="14" font-weight="400" fill="black" text-anchor="start">能、功能至上、无性别」的核</text><text x="168" y="441.0" font-size="14" font-weight="400" fill="black" text-anchor="start">心卖点，而非堆砌词汇。</text><text x="168" y="458.5" font-size="14" font-weight="400" fill="black" text-anchor="start">卖点不是一串词，而是一套能</text><text x="168" y="476.0" font-size="14" font-weight="400" fill="black" text-anchor="start">贯穿所有页面的统一话术。</text><rect x="417" y="254" width="300" height="288" fill="#414141" stroke="black"/><text x="567" y="361.0" font-size="22" font-weight="700" fill="white" text-anchor="middle">02·系统方法</text><text x="443" y="406.0" font-size="10" font-weight="400" fill="white" text-anchor="start">ASSET → TASK → GENERATE → REVIEW → OUTPUT</text><text x="443" y="423.5" font-size="14" font-weight="400" fill="white" text-anchor="start">资产沉淀、任务拆解、批量生</text><text x="443" y="441.0" font-size="14" font-weight="400" fill="white" text-anchor="start">成、审核迭代、多平台输出，</text><text x="443" y="458.5" font-size="14" font-weight="400" fill="white" text-anchor="start">形成标准化的 AIGC 工作流。</text><rect x="724" y="254" width="300" height="288" fill="white" stroke="black"/><text x="874" y="361.0" font-size="22" font-weight="700" fill="black" text-anchor="middle">03·视觉语言</text><text x="782" y="406.0" font-size="14" font-weight="400" fill="black" text-anchor="start">宣言 / 矩阵 / 档案 三种内容表达</text><text x="782" y="423.5" font-size="14" font-weight="400" fill="black" text-anchor="start">范式，覆盖不同页面形态。</text><text x="782" y="441.0" font-size="14" font-weight="400" fill="black" text-anchor="start">英文大字 + 中文小字 + 参数元信</text><text x="782" y="458.5" font-size="14" font-weight="400" fill="black" text-anchor="start">息的三层信息结构，全篇统一。</text><rect x="1031" y="254" width="300" height="288" fill="white" stroke="black"/><text x="1181" y="361.0" font-size="22" font-weight="700" fill="black" text-anchor="middle">04·落地延展</text><text x="1089" y="406.0" font-size="14" font-weight="400" fill="black" text-anchor="start">从独立站到小红书 / 抖音 / 淘宝 /</text><text x="1089" y="423.5" font-size="14" font-weight="400" fill="black" text-anchor="start">Amazon，同一母版按平台规则重组。</text><text x="1089" y="441.0" font-size="14" font-weight="400" fill="black" text-anchor="start">静态图文之外，延展视频分镜 SOP 与</text><text x="1089" y="458.5" font-size="14" font-weight="400" fill="black" text-anchor="start">结果验证，形成完整能力闭环。</text><text x="110" y="610.0" font-size="20" font-weight="400" fill="#999" text-anchor="start">传统流程 vs AIGC 流程 · 效率与成本对比</text><path d="M110 623H1310" stroke="#ddd"/><text x="110" y="650.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">出图周期 PRODUCTION TIME</text><rect x="110" y="656" width="960" height="15" fill="#555"/><rect x="110" y="676" width="130" height="15" fill="white" stroke="#111" stroke-width="2"/><text x="1086" y="671.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">2 周</text><text x="256" y="691.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">3 天</text><text x="1330" y="671.0" font-size="16" font-weight="400" fill="#999" text-anchor="end">-89%</text><text x="110" y="720.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">单图成本 COST PER IMAGE</text><rect x="110" y="726" width="800" height="15" fill="#555"/><rect x="110" y="746" width="320" height="15" fill="white" stroke="#111" stroke-width="2"/><text x="926" y="741.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">¥1,500</text><text x="446" y="761.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">¥400</text><text x="1330" y="741.0" font-size="16" font-weight="400" fill="#999" text-anchor="end">-73%</text><text x="110" y="790.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">换装换色 RESTYLE</text><rect x="110" y="796" width="880" height="15" fill="#555"/><rect x="110" y="816" width="90" height="15" fill="white" stroke="#111" stroke-width="2"/><text x="1006" y="811.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">需重拍</text><text x="216" y="831.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">即时</text><text x="1330" y="811.0" font-size="16" font-weight="400" fill="#999" text-anchor="end">-90%</text><text x="110" y="860.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">多平台适配 ADAPTATION</text><rect x="110" y="866" width="760" height="15" fill="#555"/><rect x="110" y="886" width="240" height="15" fill="white" stroke="#111" stroke-width="2"/><text x="886" y="881.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">手工裁剪</text><text x="366" y="901.0" font-size="12" font-weight="400" fill="#111" text-anchor="start">批量输出</text><text x="1330" y="881.0" font-size="16" font-weight="400" fill="#999" text-anchor="end">-85%</text><text x="110" y="946.0" font-size="14" font-weight="400" fill="#bbb" text-anchor="start">❇ 数据为行业合理区间示例，非真实运营数据</text><text x="1092" y="946.0" font-size="16" font-weight="400" fill="#111" text-anchor="start">TRADITIONAL 传统　　□ AIGC</text><rect x="1066" y="933" width="16" height="16" fill="#555"/></g></svg>