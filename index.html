<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>zouhuomiaoyu</title>
    <style>
      :root {
        color-scheme: light;
        --sidebar-width: 31.25vw;
        --gutter: 5px;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: #fff;
        font-family: "SimHei", "黑体", sans-serif;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 1000;
        width: var(--sidebar-width);
        background: #fff;
        color: #212224;
        display: flex;
        transition: transform .24s ease;
        flex-direction: column;
        padding: 4vh 4vw 9vh 3.5vw;
      }

      .profile-copy,
      .project-list,
      .location { font-size: clamp(11px, 0.95vw, 14px); line-height: 1.35; font-weight: 400; }

      .profile-copy { margin-top: 10px; }
      .profile-copy p { margin: 0; }
      .profile-copy p:first-child { font-weight: 700; }
      .profile-copy p + p { margin-top: 6px; }

      .project-list {
        display: grid;
        gap: 34px;
        margin-top: 38px;
      }

      .project-section-title { margin: 0 0 12px; }

      .project-section-items { display: grid; gap: 12px; }

      .project-row {
        position: relative;
        z-index: 0;
        width: 100%;
        border: 0;
        padding: 0 0 0 6px;
        background: transparent;
        color: #6F6A65;
        font: inherit;
        font-weight: 400;
        text-align: left;
        cursor: pointer;
        transition: color .16s ease, padding-left .16s ease;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: flex-start;
        gap: 8px;
      }

      .project-bullet { flex: 0 0 auto; }

      .project-row:hover,
      .project-row.is-active,
      .project-row:focus-visible { color: #fff; padding-left: 6px; }

      .project-row:hover::before,
      .project-row.is-active::before,
      .project-row:focus-visible::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -3px -6px;
        border-radius: 6px;
        background: #000;
        pointer-events: none;
        transition: background-color .16s ease;
      }

      .project-title { min-width: 0; }
      .project-title.has-external-link { display: inline-flex; align-items: center; gap: 5px; }
      .external-link-icon { width: 13px; height: 13px; flex: 0 0 auto; overflow: visible; }
      .external-link-icon path,
      .external-link-icon rect { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .external-link-icon .external-arrow { transition: transform .18s ease; transform-origin: 16px 8px; }
      .project-row:hover .external-arrow,
      .project-row:focus-visible .external-arrow,
      .tile:hover .external-arrow,
      .tile:focus-visible .external-arrow { transform: translate(1px, -1px); }
      .project-year { white-space: nowrap; }

      .location { margin-top: auto; white-space: pre-line; }

      main {
        margin-left: var(--sidebar-width);
        min-height: 100vh;
        overflow: hidden;
        background: #fafafa;
      }
      body.detail-open main { overflow: visible; }

      .sidebar-collapse-toggle {
        display: none;
        position: fixed;
        z-index: 1101;
        top: 12px;
        left: calc(var(--sidebar-width) - 60px);
        width: 48px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #212224;
        cursor: pointer;
        transition: left .32s ease, background-color .16s ease;
      }

      .sidebar-collapse-toggle svg { width: 27px; height: 27px; overflow: visible; }
      .sidebar-collapse-toggle svg path,
      .sidebar-collapse-toggle svg line,
      .sidebar-collapse-toggle svg rect { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .sidebar-collapse-toggle .panel-divider,
      .sidebar-collapse-toggle .panel-chevron { transition: transform .22s ease; }
      .sidebar-collapse-toggle:hover .panel-divider { transform: translateX(-1px); }
      .sidebar-collapse-toggle:hover .panel-chevron { transform: translateX(-1.5px); }
      body.sidebar-collapsed .sidebar-collapse-toggle .panel-chevron { transform: translateX(1px); }
      body.sidebar-collapsed .sidebar-collapse-toggle:hover .panel-chevron { transform: translateX(2.5px); }

      .sidebar-collapse-toggle:hover { background: transparent; }
      body.detail-open .sidebar-collapse-toggle { display: grid; place-items: center; }
      body.sidebar-collapsed .sidebar { transform: translateX(-100%); pointer-events: none; }
      body.sidebar-collapsed main { margin-left: 0; }
      body.sidebar-collapsed .sidebar-collapse-toggle { left: 12px; }
      @media (prefers-reduced-motion: reduce) {
        .sidebar, .sidebar-collapse-toggle { transition: none; }
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gutter);
      }

      .tile {
        position: relative;
        overflow: hidden;
        container-type: inline-size;
        aspect-ratio: 1 / 1;
        background: #f5f5f5;
        border: 0;
        border-radius: 0;
        padding: 0;
        display: block;
        width: 100%;
      }

      button.tile { cursor: pointer; }

      .tile::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background: rgba(56, 45, 65, .18);
        opacity: 0;
        transition: opacity .22s ease;
        pointer-events: none;
      }

      .tile-project-name {
        position: absolute;
        z-index: 3;
        right: 12px;
        bottom: 12px;
        color: #382D41;
        font-size: clamp(15px, 3cqw, 20px);
        font-weight: 700;
        line-height: 1.2;
        text-align: right;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity .22s ease, transform .22s ease;
        pointer-events: none;
      }

      .tile-external-hint {
        position: absolute;
        z-index: 3;
        top: 12px;
        right: 12px;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: #382D41;
        background: #fff;
        pointer-events: none;
      }
      .tile-external-hint .external-link-icon { width: 16px; height: 16px; }

      .tile:hover::before,
      .tile.is-active::before,
      .tile:focus-visible::before { opacity: 1; }

      .tile:hover .tile-project-name,
      .tile.is-active .tile-project-name,
      .tile:focus-visible .tile-project-name { opacity: 1; transform: translateY(0); }


      .tile-preview-video,
      .tile-preview-frame {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .tile-preview-video {
        width: 72.8525%;
        aspect-ratio: 16 / 9;
        height: auto;
        object-fit: contain;
        border-radius: 0;
      }

      .tile-preview-frame {
        z-index: 1;
        width: 96.6%;
        height: auto;
        aspect-ratio: 1013 / 543;
        object-fit: contain;
      }

      button.tile:focus-visible { outline: 2px solid #222; outline-offset: -4px; }

      .tile:nth-child(4n + 2),
      .tile:nth-child(4n + 3) { background: #f1f1f1; }

      .tile:nth-child(7n) { background: #e9e9e9; }

      .detail-view {
        position: relative;
        min-height: 100vh;
        padding: 0;
        background: #fff;
      }

      .detail-content {
        transform: scale(var(--detail-zoom, 1));
        transform-origin: top center;
      }

      .detail-zoom-controls {
        display: none;
        position: fixed;
        z-index: 1200;
        right: 24px;
        top: 24px;
        align-items: center;
        gap: 4px;
        padding: 6px;
        border: 1px solid #dedee1;
        border-radius: 8px;
        background: #fff;
        color: #212224;
        box-shadow: 0 2px 10px #00000014;
        font: 13px/1 "SimHei", sans-serif;
      }
      body.detail-open .detail-zoom-controls { display: flex; }
      .detail-zoom-controls button,
      .detail-zoom-controls input {
        height: 32px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .detail-zoom-controls button { min-width: 32px; padding: 0 8px; cursor: pointer; }
      .detail-zoom-controls button:hover { background: #f0f0f2; }
      .detail-zoom-controls input[type="range"] { width: 82px; height: 24px; padding: 0; accent-color: #61609a; cursor: ew-resize; }
      .detail-zoom-value { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
      .detail-zoom-controls :focus-visible { outline: 2px solid #61609a; outline-offset: 1px; }

      .back-to-top {
        display: none;
        position: fixed;
        z-index: 1200;
        right: 24px;
        bottom: 80px;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #212224;
        color: #fff;
        cursor: pointer;
      }
      body.detail-open.detail-scrolled .back-to-top { display: grid; }
      .back-to-top:hover { background: #45464a; }
      .back-to-top svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .back-to-top:hover .back-to-top-arrow { animation: arrow-up-head .4s ease-in-out; }
      .back-to-top:hover .back-to-top-shaft { animation: arrow-up-shaft .4s ease-in-out; transform-box: view-box; transform-origin: 12px 19px; }
      @keyframes arrow-up-head {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(3px); }
      }
      @keyframes arrow-up-shaft {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(.64); }
      }
      @media (prefers-reduced-motion: reduce) {
        .back-to-top:hover .back-to-top-arrow,
        .back-to-top:hover .back-to-top-shaft { animation: none; }
      }
      @media (max-width: 640px) {
        .back-to-top { right: 14px; bottom: 64px; }
        .detail-zoom-controls { right: 14px; top: 14px; }
      }

      .detail-content {
        display: grid;
        gap: 0;
        width: calc(100vw - var(--sidebar-width));
        margin-inline: auto;
      }

      .video-player { position: relative; min-width: 0; background: #000; color: #fff; }
      .video-controls { position: absolute; inset: auto 0 0; padding: 24px 18px 5px; background: linear-gradient(transparent, #000b); transition: opacity .2s; font-size: 13px; z-index: 2; opacity: 0; pointer-events: none; }
      .video-player:hover .video-controls { opacity: 1; pointer-events: auto; }
      .video-toolbar { display: flex; align-items: center; gap: 16px; height: 40px; }
      .video-toolbar-spacer { flex: 1; }
      .video-controls button { display: grid; place-items: center; flex-shrink: 0; padding: 5px; width: 30px; height: 32px; border: 0; background: none; color: #fff; cursor: pointer; }
      .video-controls button:hover { color: #00aeec; }
      .video-controls svg { width: 22px; height: 22px; fill: currentColor; }
      .video-controls :focus-visible { outline: 2px solid #00aeec; outline-offset: 2px; }
      .video-progress { display: block; appearance: none; width: 100%; height: 3px; padding: 0; margin: 0 0 4px; border-radius: 3px; background: linear-gradient(to right, #00aeec var(--played, 0%), #ffffff59 var(--played, 0%)); cursor: pointer; }
      .video-progress:hover { height: 5px; margin-top: -2px; }
      .video-progress::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #00aeec; }
      .video-progress::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #00aeec; }
      .video-time { white-space: nowrap; font-variant-numeric: tabular-nums; font-family: Arial, sans-serif; }
      .video-speed { border: 0; background: transparent; color: white; font: inherit; cursor: pointer; padding: 6px 0; }
      .video-speed option { background: #222; color: white; }
      .video-volume-group { display: flex; align-items: center; gap: 4px; }
      .video-volume { width: 60px; height: 3px; accent-color: #00aeec; cursor: pointer; }
      .video-player:fullscreen, .video-player.web-fullscreen { display: flex; align-items: center; justify-content: center; background: #000; }
      .video-player.web-fullscreen { position: fixed; inset: 0; z-index: 1000; }
      body.video-expanded { overflow: hidden; }
      .video-player:fullscreen video, .video-player.web-fullscreen video { width: 100%; height: 100%; object-fit: contain; }
      /* Controls scale against a 1000px-wide player, including fullscreen. */
      .video-player { container-type: inline-size; }
      .video-controls { padding: 2.4cqw 1.8cqw .5cqw; font-size: 1.3cqw; }
      .video-toolbar { gap: 1.6cqw; height: 4cqw; }
      .video-controls button { padding: .5cqw; width: 3cqw; height: 3.2cqw; }
      .video-controls svg { width: 2.2cqw; height: 2.2cqw; }
      .video-progress { height: .3cqw; margin-bottom: .4cqw; }
      .video-progress:hover { height: .5cqw; margin-top: -.2cqw; }
      .video-progress::-webkit-slider-thumb { width: 1.1cqw; height: 1.1cqw; }
      .video-progress::-moz-range-thumb { width: 1.1cqw; height: 1.1cqw; }
      .video-volume-group { gap: .4cqw; }
      .video-volume { width: 6cqw; height: .3cqw; }
      .video-speed { padding: .6cqw 0; }
      .video-paused-play { display: none; position: absolute; right: 3cqw; bottom: 8cqw; width: 6.4cqw; height: 6.4cqw; padding: 1.4cqw; border: .25cqw solid #ffffffb3; border-radius: 1.5cqw; color: white; background: #0005; cursor: pointer; z-index: 2; }
      .video-paused-play svg { display: block; width: 100%; height: 100%; fill: currentColor; }
      .video-player.is-paused .video-paused-play { display: block; }
      .video-paused-play:hover { background: #0008; }
      .detail-content video { display: block; width: 100%; height: auto; background: #000; }
      .tvc-lead-video { width: 90%; aspect-ratio: 16 / 9; margin: 9% auto 2%; overflow: hidden; }
      .tvc-lead-video video { width: 100%; height: 100%; object-fit: cover; }
      .tile--website-card { position: relative; background: #f1f1f1; display: grid; place-items: center; }
      .website-card-cover { display: block; width: 72%; height: auto; aspect-ratio: 1440 / 972; object-fit: cover; object-position: center top; border-radius: 2%; box-shadow: 0 1.3vw 3vw #00000013; }
      .tile--centered-cover { display: grid; place-items: center; }
      .centered-tile-cover { display: block; width: 80%; height: auto; max-height: 80%; object-fit: contain; object-position: center; }
      .tvc-lead-video { aspect-ratio: 832 / 544; }
      .tvc-lead-video.web-fullscreen { width: 100%; height: 100%; margin: 0; aspect-ratio: auto; background: #fff; }
      .tvc-lead-video.web-fullscreen video { object-fit: contain; background: #fff; }

      .detail-content img { display: block; width: 100%; height: auto; }

      .concept-section { position: relative; width: 100%; container-type: inline-size; }
      .concept-background { width: 100%; height: auto; }
      .concept-copy { position: absolute; display: block; height: auto; }
      .detail-content img.concept-copy--intro { top: 0; left: 25.7%; width: 49.9%; }
      .detail-content img.concept-copy--summary { top: 82.7%; left: 19.65%; width: 60.7%; }
      .detail-content img.concept-copy--body { top: 88.4%; left: 25.5%; width: 49.5%; }
      .detail-content img.concept-divider {
        position: absolute;
        z-index: 2;
        left: 7.5%;
        bottom: 0;
        width: 85%;
        transform: translateY(50%);
      }

      .layered-composition { position: relative; width: 100%; }
      .composition-background { display: block; width: 100%; height: auto; }
      .composition-layer { position: absolute; display: block; height: auto; max-width: none; }
      .composition-layer--circle { border-radius: 50%; object-fit: cover; }
      .layered-composition:has(.composition-text) { container-type: inline-size; }
      .composition-text { position: absolute; white-space: nowrap; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .composition-text strong { font-weight: 700; }
      .composition-text--reflection { -webkit-box-reflect: below -.65em linear-gradient(transparent 30%, #0005); }
      .project02-intro::after { content: ""; position: absolute; left: 92.08333%; top: 3.51852%; width: .83333%; aspect-ratio: 1; border-radius: 50%; background: #000; box-shadow: 1.5cqw 0 #000, 3cqw 0 #000, .75cqw 1.25cqw #000, 2.25cqw 1.25cqw #000; }
      .project02-task { container-type: inline-size; }
      .project02-task::before { content: ""; position: absolute; left: 4.86%; right: 5%; top: 12.64%; height: max(1px, .14cqw); background: #888; z-index: 2; }
      .project02-task::after { content: ""; position: absolute; left: 91.5%; top: 18%; width: .8cqw; aspect-ratio: 1; border-radius: 50%; background: #000; box-shadow: 1.8cqw 0 #000, 3.6cqw 0 #000, .9cqw 1.35cqw #000, 2.7cqw 1.35cqw #000; z-index: 2; }

      body.art-gallery-open { overflow: hidden; }
      .art-gallery { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #fff; color: #382D41; touch-action: none; user-select: none; cursor: grab; outline-offset: -3px; }
      .art-gallery.is-dragging { cursor: grabbing; }
      .art-gallery-stage { position: absolute; inset: 0; perspective: 1400px; }
      .art-gallery-card { position: absolute; left: 50%; top: 50%; width: 52%; height: 44%; margin: 0; will-change: transform; transform-style: preserve-3d; }
      .detail-content .art-gallery-card img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
      .art-gallery-counter { position: absolute; z-index: 50; inset: auto 5% 28px; font-size: 11px; letter-spacing: .08em; pointer-events: none; }
      @media (max-width: 640px) {
        .art-gallery-card { width: 78%; height: 44%; }
        .art-gallery-counter { inset: auto 6% 24px; font-size: 9px; }
      }

      [hidden] { display: none !important; }

      @media (max-width: 640px) {
        :root { --sidebar-width: 28vw; --gutter: 4px; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="profile-copy" id="profile-copy"></div>
      <div class="project-list" id="project-list"></div>
      <div class="location" id="location"></div>
    </aside>
    <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" aria-label="隐藏侧边栏" aria-controls="sidebar" aria-expanded="true" title="隐藏侧边栏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line class="panel-divider" x1="9" y1="3" x2="9" y2="21"/><path class="panel-chevron" d="m16 15-3-3 3-3"/></svg>
    </button>
    <main aria-label="作品展示区域">
      <section class="gallery" id="gallery" aria-label="作品网格"></section>
      <section class="detail-view" id="detail-view" aria-label="作品详情" hidden>
        <div class="detail-content" id="detail-content"></div>
      </section>
    </main>
    <!-- ArrowUp artwork and hover motion adapted from lucide-animated: https://github.com/pqoqubbw/icons/blob/main/icons/arrow-up.tsx -->
    <button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部" title="回到顶部">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="back-to-top-arrow" d="m5 12 7-7 7 7"/><path class="back-to-top-shaft" d="M12 19V5"/></svg>
    </button>
    <div class="detail-zoom-controls" id="detail-zoom-controls" role="group" aria-label="详情页缩放">
      <button type="button" data-zoom-action="fit" title="适配详情内容（Shift+1）">适配</button>
      <button type="button" data-zoom-action="out" aria-label="缩小" title="缩小（⌘/Ctrl−）">−</button>
      <input id="detail-zoom-range" type="range" min="50" max="200" step="1" value="100" aria-label="缩放比例" title="拖动调整缩放比例（50%–200%）" />
      <output class="detail-zoom-value" id="detail-zoom-value" for="detail-zoom-range">100%</output>
      <button type="button" data-zoom-action="in" aria-label="放大" title="放大（⌘/Ctrl+）">+</button>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
