<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>个人网站原型</title>
    <style>
      :root {
        color-scheme: light;
        --sidebar-width: 31.25vw;
        --gutter: 5px;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: #fff;
        font-family: Arial, sans-serif;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--sidebar-width);
        background: #f1eeef;
        color: #382d41;
        border-right: 1px solid #d9d4d8;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        padding: 4vh 4vw 9vh 3.5vw;
      }

      .sidebar-avatar-home {
        display: block;
        flex: 0 0 auto;
        width: min(100%, 200px);
        aspect-ratio: 1;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: transparent;
        cursor: pointer;
      }

      .sidebar-avatar-home img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .sidebar-avatar-home:focus-visible { outline: 2px solid #382d41; outline-offset: 3px; }

      .sidebar::before {
        content: "";
        position: absolute;
        inset: 0 3.81% 0 4.87%;
        background: #fbf7f8;
        box-shadow: 0 0 9px #00000040;
        z-index: -1;
        pointer-events: none;
      }

      .sidebar::after {
        content: "";
        position: absolute;
        inset: 3.06% 0 2.88%;
        border-block: 1px solid #d9d4d8;
        pointer-events: none;
      }

      .sidebar-registration {
        position: absolute;
        inset: 3.06% 3.81% 2.88% 4.87%;
        pointer-events: none;
        background:
          linear-gradient(#382d41, #382d41) left top / 12px 1px,
          linear-gradient(#382d41, #382d41) left top / 1px 12px,
          linear-gradient(#382d41, #382d41) right top / 12px 1px,
          linear-gradient(#382d41, #382d41) right top / 1px 12px,
          linear-gradient(#382d41, #382d41) left bottom / 12px 1px,
          linear-gradient(#382d41, #382d41) left bottom / 1px 12px,
          linear-gradient(#382d41, #382d41) right bottom / 12px 1px,
          linear-gradient(#382d41, #382d41) right bottom / 1px 12px;
        background-repeat: no-repeat;
        z-index: 1;
      }

      .profile-copy,
      .project-list,
      .location { font-size: clamp(11px, 0.95vw, 14px); line-height: 1.35; }

      .profile-copy { margin-top: 10px; }
      .profile-copy p { margin: 0; }
      .profile-copy p:first-child { font-weight: 700; }
      .profile-copy p + p { margin-top: 6px; }

      .project-list {
        display: grid;
        gap: 14px;
        margin-top: 26px;
      }

      .project-row {
        position: relative;
        z-index: 0;
        width: 100%;
        border: 0;
        padding: 0;
        background: transparent;
        color: #382D41;
        font: inherit;
        text-align: left;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }

      .project-row:hover::before,
      .project-row.is-active::before,
      .project-row:focus-visible::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -3px -2.8vw -3px -2vw;
        background: #F1EEEF;
        pointer-events: none;
        transition: background-color .16s ease;
      }

      .project-title { max-width: 78%; }

      .location { margin-top: auto; white-space: pre-line; }

      main {
        margin-left: var(--sidebar-width);
        min-height: 100vh;
        overflow: hidden;
        background: #fafafa;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gutter);
      }

      .tile {
        position: relative;
        overflow: hidden;
        container-type: inline-size;
        aspect-ratio: 1 / 1;
        background: #f5f5f5;
        border: 0;
        border-radius: 0;
        padding: 0;
        display: block;
        width: 100%;
      }

      button.tile { cursor: pointer; }

      .tile::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background: rgba(56, 45, 65, .18);
        opacity: 0;
        transition: opacity .22s ease;
        pointer-events: none;
      }

      .tile-project-name {
        position: absolute;
        z-index: 3;
        right: 12px;
        bottom: 12px;
        color: #382D41;
        font-size: clamp(15px, 3cqw, 20px);
        font-weight: 700;
        line-height: 1.2;
        text-align: right;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity .22s ease, transform .22s ease;
        pointer-events: none;
      }

      .tile:hover::before,
      .tile.is-active::before,
      .tile:focus-visible::before { opacity: 1; }

      .tile:hover .tile-project-name,
      .tile.is-active .tile-project-name,
      .tile:focus-visible .tile-project-name { opacity: 1; transform: translateY(0); }

      .project-row.is-active .project-title { font-weight: 600; }

      .tile-preview-video,
      .tile-preview-frame {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .tile-preview-video {
        width: 72.8525%;
        aspect-ratio: 16 / 9;
        height: auto;
        object-fit: contain;
        border-radius: 0;
      }

      .tile-preview-frame {
        z-index: 1;
        width: 96.6%;
        height: auto;
        aspect-ratio: 1013 / 543;
        object-fit: contain;
      }

      button.tile:focus-visible { outline: 2px solid #222; outline-offset: -4px; }

      .tile:nth-child(4n + 2),
      .tile:nth-child(4n + 3) { background: #f1f1f1; }

      .tile:nth-child(7n) { background: #e9e9e9; }

      .detail-view {
        position: relative;
        min-height: 100vh;
        padding: 0;
        background: #fff;
      }

      .detail-content {
        display: grid;
        gap: 0;
        width: 100%;
      }

      .video-player { position: relative; min-width: 0; background: #000; color: #fff; }
      .video-controls { position: absolute; inset: auto 0 0; padding: 24px 18px 5px; background: linear-gradient(transparent, #000b); transition: opacity .2s; font-size: 13px; z-index: 2; opacity: 0; pointer-events: none; }
      .video-player:hover .video-controls { opacity: 1; pointer-events: auto; }
      .video-toolbar { display: flex; align-items: center; gap: 16px; height: 40px; }
      .video-toolbar-spacer { flex: 1; }
      .video-controls button { display: grid; place-items: center; flex-shrink: 0; padding: 5px; width: 30px; height: 32px; border: 0; background: none; color: #fff; cursor: pointer; }
      .video-controls button:hover { color: #00aeec; }
      .video-controls svg { width: 22px; height: 22px; fill: currentColor; }
      .video-controls :focus-visible { outline: 2px solid #00aeec; outline-offset: 2px; }
      .video-progress { display: block; appearance: none; width: 100%; height: 3px; padding: 0; margin: 0 0 4px; border-radius: 3px; background: linear-gradient(to right, #00aeec var(--played, 0%), #ffffff59 var(--played, 0%)); cursor: pointer; }
      .video-progress:hover { height: 5px; margin-top: -2px; }
      .video-progress::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #00aeec; }
      .video-progress::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #00aeec; }
      .video-time { white-space: nowrap; font-variant-numeric: tabular-nums; font-family: Arial, sans-serif; }
      .video-speed { border: 0; background: transparent; color: white; font: inherit; cursor: pointer; padding: 6px 0; }
      .video-speed option { background: #222; color: white; }
      .video-volume-group { display: flex; align-items: center; gap: 4px; }
      .video-volume { width: 60px; height: 3px; accent-color: #00aeec; cursor: pointer; }
      .video-player:fullscreen, .video-player.web-fullscreen { display: flex; align-items: center; justify-content: center; background: #000; }
      .video-player.web-fullscreen { position: fixed; inset: 0; z-index: 1000; }
      body.video-expanded { overflow: hidden; }
      .video-player:fullscreen video, .video-player.web-fullscreen video { width: 100%; height: 100%; object-fit: contain; }
      /* Controls scale against a 1000px-wide player, including fullscreen. */
      .video-player { container-type: inline-size; }
      .video-controls { padding: 2.4cqw 1.8cqw .5cqw; font-size: 1.3cqw; }
      .video-toolbar { gap: 1.6cqw; height: 4cqw; }
      .video-controls button { padding: .5cqw; width: 3cqw; height: 3.2cqw; }
      .video-controls svg { width: 2.2cqw; height: 2.2cqw; }
      .video-progress { height: .3cqw; margin-bottom: .4cqw; }
      .video-progress:hover { height: .5cqw; margin-top: -.2cqw; }
      .video-progress::-webkit-slider-thumb { width: 1.1cqw; height: 1.1cqw; }
      .video-progress::-moz-range-thumb { width: 1.1cqw; height: 1.1cqw; }
      .video-volume-group { gap: .4cqw; }
      .video-volume { width: 6cqw; height: .3cqw; }
      .video-speed { padding: .6cqw 0; }
      .video-paused-play { display: none; position: absolute; right: 3cqw; bottom: 8cqw; width: 6.4cqw; height: 6.4cqw; padding: 1.4cqw; border: .25cqw solid #ffffffb3; border-radius: 1.5cqw; color: white; background: #0005; cursor: pointer; z-index: 2; }
      .video-paused-play svg { display: block; width: 100%; height: 100%; fill: currentColor; }
      .video-player.is-paused .video-paused-play { display: block; }
      .video-paused-play:hover { background: #0008; }
      .detail-content video { display: block; width: 100%; height: auto; background: #000; }
      .tvc-lead-video { width: 90%; aspect-ratio: 16 / 9; margin: 9% auto 2%; overflow: hidden; }
      .tvc-lead-video video { width: 100%; height: 100%; object-fit: cover; }
      .tile--website-card { position: relative; background: #f1f1f1; display: grid; place-items: center; }
      .website-card-cover { display: block; width: 72%; aspect-ratio: 1440 / 972; object-fit: cover; object-position: center top; border-radius: 2%; box-shadow: 0 1.3vw 3vw #00000013; }
      .tile--centered-cover { display: grid; place-items: center; }
      .centered-tile-cover { display: block; width: 80%; max-height: 80%; object-fit: contain; object-position: center; }
      .tvc-lead-video { aspect-ratio: 832 / 544; }
      .tvc-lead-video.web-fullscreen { width: 100%; height: 100%; margin: 0; aspect-ratio: auto; background: #fff; }
      .tvc-lead-video.web-fullscreen video { object-fit: contain; background: #fff; }

      .detail-content img { display: block; width: 100%; height: auto; }

      .concept-section { position: relative; width: 100%; container-type: inline-size; }
      .concept-background { width: 100%; height: auto; }
      .concept-copy { position: absolute; display: block; height: auto; }
      .detail-content img.concept-copy--intro { top: 0; left: 25.7%; width: 49.9%; }
      .detail-content img.concept-copy--summary { top: 82.7%; left: 19.65%; width: 60.7%; }
      .detail-content img.concept-copy--body { top: 88.4%; left: 25.5%; width: 49.5%; }
      .detail-content img.concept-divider {
        position: absolute;
        z-index: 2;
        left: 7.5%;
        bottom: 0;
        width: 85%;
        transform: translateY(50%);
      }

      .layered-composition { position: relative; width: 100%; }
      .composition-background { display: block; width: 100%; height: auto; }
      .composition-layer { position: absolute; display: block; height: auto; max-width: none; }
      .composition-layer--circle { border-radius: 50%; object-fit: cover; }
      .layered-composition:has(.composition-text) { container-type: inline-size; }
      .composition-text { position: absolute; white-space: nowrap; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .composition-text strong { font-weight: 700; }
      .composition-text--reflection { -webkit-box-reflect: below -.65em linear-gradient(transparent 30%, #0005); }
      .project02-intro::after { content: ""; position: absolute; left: 92.08333%; top: 3.51852%; width: .83333%; aspect-ratio: 1; border-radius: 50%; background: #000; box-shadow: 1.5cqw 0 #000, 3cqw 0 #000, .75cqw 1.25cqw #000, 2.25cqw 1.25cqw #000; }
      .project02-task { container-type: inline-size; }
      .project02-task::before { content: ""; position: absolute; left: 4.86%; right: 5%; top: 12.64%; height: max(1px, .14cqw); background: #888; z-index: 2; }
      .project02-task::after { content: ""; position: absolute; left: 91.5%; top: 18%; width: .8cqw; aspect-ratio: 1; border-radius: 50%; background: #000; box-shadow: 1.8cqw 0 #000, 3.6cqw 0 #000, .9cqw 1.35cqw #000, 2.7cqw 1.35cqw #000; z-index: 2; }

      body.art-gallery-open { overflow: hidden; }
      .art-gallery { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #f1eeef; color: #382D41; touch-action: none; user-select: none; cursor: grab; outline-offset: -3px; }
      .art-gallery.is-dragging { cursor: grabbing; }
      .art-gallery-stage { position: absolute; inset: 0; perspective: 1400px; }
      .art-gallery-card { position: absolute; left: 50%; top: 50%; width: 52%; height: 44%; margin: 0; will-change: transform; transform-style: preserve-3d; }
      .detail-content .art-gallery-card img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
      .art-gallery-counter { position: absolute; z-index: 50; inset: auto 5% 28px; font-size: 11px; letter-spacing: .08em; pointer-events: none; }
      @media (max-width: 640px) {
        .art-gallery-card { width: 78%; height: 44%; }
        .art-gallery-counter { inset: auto 6% 24px; font-size: 9px; }
      }

      [hidden] { display: none !important; }

      @media (max-width: 640px) {
        :root { --sidebar-width: 28vw; --gutter: 4px; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <span class="sidebar-registration" aria-hidden="true"></span>
      <button class="sidebar-avatar-home" type="button" aria-label="返回主页" title="返回主页">
        <img src="./assets/GIF头像.gif" alt="" />
      </button>
      <div class="profile-copy" id="profile-copy"></div>
      <div class="project-list" id="project-list"></div>
      <div class="location" id="location"></div>
    </aside>
    <main aria-label="作品展示区域">
      <section class="gallery" id="gallery" aria-label="作品网格"></section>
      <section class="detail-view" id="detail-view" aria-label="作品详情" hidden>
        <div class="detail-content" id="detail-content"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
